#upsname: c2r1ups1
model: СИПБ6КД.9-11/БПС 6000 ВА

logger:
  logdir: "./"
  filename: "ups-agent.log"

snmp:
  addr: 172.30.2.20
  community: public
  polltime: 60s

# Если во время сбоя питания оставшийся процент заряда батареи (по данным ИБП)
# ниже или равен batterylevel, ups-agent инициирует отключение системы.
batterylevel: 10

# Если во время сбоя питания оставшееся время работы в минутах (по данным ИБП)
# меньше или равно minutes, ups-agent инициирует отключение системы.
minutes: 10m
