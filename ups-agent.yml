# upsname: ups-name
model: СИПБ6КД.9-11/БПС

logger:
  level: "debug"
  logdir: "logs"
  filename: "ups-agent.log"

powerctl:
  # Если во время сбоя питания оставшийся процент заряда батареи (по данным ИБП)
  # ниже или равен batterylevel, ups-agent инициирует отключение системы.
  batterylevel: 11

  # Если во время сбоя питания оставшееся время работы в минутах (по данным ИБП)
  # меньше или равно minutes, ups-agent инициирует отключение системы.
  minutes: 10m

  # Если во время сбоя питания время, которое ИБП работает от батареи (по данным ИБП),
  # больше или равно timeout, ups-agent инициирует отключение системы.
  # По умолчению отключено, значение '0s'
  # timeout: 0s

  # Выключать ли ИБП при завершении работы системы. ИБП завершит работу через 'shutoffdelay'.
  # Эта настройка должны быть указана только на одной машине из всех подключенных к ИБП;
  # должна быть выбрана машина, которая будет завершаться позже всех остальных.
  # По умолчанию отключено, значение 'false'
  # upspoweroff: false

snmp:
  addr: 2.3.4.5
  community: public
  polltime: 60s
  traplistener: 1.2.3.4:162

cardconfig:
  # Номинальное напряжение
  # Допустимые значения для ввода: 220, 225, 230, 240
  # ratedoutputvoltage: 220

  # Максимально допустимое входное напряжение в режиме онлайн
  # Допустимые значения для ввода: 253, 264, 271, 280
  # hightransfervolt:

  # Минимально допустимое входное напряжение в режиме онлайн
  # Допустимые значения для ввода: 188, 196, 204, 208
  # lowtransfervolt:

  # Программируемая ошибка
  # Настройка того, как ИБП должен реагировать на аварию в сети, по таймеру или по состоянию АКБ
  # Целое значение: По времени (1); При низком заряде АКБ (2); Никогда (3)
  # alarm: 3

  # Время до информирования об аварии в сети, секунды
  # Если ИБП настроен на реагирование на аварию в сети по таймеру, в данном пункте задается пауза
  # между началом аварии в сети и включением сигнала об аварии.
  # Допустимые значения: 0, 30
  # alarmtimer: 0s

  # Емкость восстановления АКБ
  # После полного разряда АКБ ИБП не будет подавать питание на нагрузку, пока емкость
  # не восстановится до заданного значения.
  # Целое значение: 0-100%
  # Допустимые значения: 0, 10, 25, 90
  # minreturncapacity: 0

  # Чувствительность ИБП к шуму и колебаниям
  # Целое значение: Авто (1); Низкая (2); Средняя (3); Высокая (4)
  # sensitivity: 1

  # Время до отключения при низком заряде АКБ, секунды
  # При переходе АКБ в режим "низкий заряд АКБ" включается таймер, ИБП будет подавать питание
  # на нагрузку в течение заданного значения времени.
  # Допустимые значения: 120, 300, 420, 600
  # lowbatteryruntime: 120s

  # Задержка включения ИБП, секунды
  # Данная настройка используется при перезагрузке ИБП, а так же при пробуждении из сна.
  # Допустимые значения: 0, 60, 180, 300
  # returndelay: 60s

  # Задержка выключения ИБП, секунды
  # Задержка выключения ИБП при получении сигнала о выключении.
  # Допустимые значения: 12, 18, 24, 30, 36, 42, 48, 54, 60, 120, 180, 240, 300, 360, 420, 480, 540, 600
  # shutoffdelay: 120s

  # Время сна ИБП, минуты
  # Время, на которое ИБП отправляется в сон.
  # Допустимые значения: 0 - 9999.
  # upssleeptime: 2m
